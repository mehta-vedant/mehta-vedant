<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vedant Mehta developer command center</title>
  <desc id="desc">Animated neon grid and developer status panel</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="900" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1021"/>
      <stop offset=".48" stop-color="#1A1B36"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="neon" x1="60" y1="0" x2="840" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DCFFF"/>
      <stop offset=".48" stop-color="#BB9AF7"/>
      <stop offset="1" stop-color="#9ECE6A"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#7AA2F7" stroke-opacity=".14"/>
    </pattern>
    <filter id="glow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="180" rx="14" fill="url(#background)"/>
  <rect width="900" height="180" rx="14" fill="url(#grid)"/>
  <path d="M0 137C94 106 139 164 232 130C325 96 357 54 451 84C545 115 595 164 683 118C768 74 819 96 900 54" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="4s" repeatCount="indefinite"/>
  </path>
  <g fill="#7DCFFF" filter="url(#glow)">
    <circle cx="232" cy="130" r="4"><animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="451" cy="84" r="4"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="683" cy="118" r="4"><animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="monospace" letter-spacing="2">
    <text x="48" y="48" fill="#C0CAF5" font-size="14">SYSTEM STATUS</text>
    <circle cx="51" cy="74" r="5" fill="#9ECE6A"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="66" y="79" fill="#9ECE6A" font-size="15">BUILDING IN PUBLIC</text>
    <text x="48" y="108" fill="#7AA2F7" font-size="11">AI / DATA / PRODUCT / SYSTEMS</text>
  </g>
  <g transform="translate(674 28)">
    <rect width="178" height="50" rx="8" fill="#0B1021" fill-opacity=".78" stroke="#BB9AF7" stroke-opacity=".65"/>
    <text x="16" y="22" fill="#BB9AF7" font-family="monospace" font-size="10" letter-spacing="1.5">CURRENT MODE</text>
    <text x="16" y="39" fill="#C0CAF5" font-family="monospace" font-size="13">SHIP · LEARN · REPEAT</text>
  </g>
</svg>
